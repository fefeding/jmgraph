name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      # 测试内置 canvas mock 兜底，跳过 canvas 原生编译（--ignore-scripts）以稳定 CI
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
